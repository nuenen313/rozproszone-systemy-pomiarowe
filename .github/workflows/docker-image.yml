name: Docker Compose Build Check

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Build flask
        run: docker compose build flask
      
      - name: Build broker
        run: docker compose build broker
      
      - name: Build database
        run: docker compose build database
